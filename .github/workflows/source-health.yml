name: Timestamp source availability
on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh HTTP availability only (not scientific claims or scores)
        run: python scripts/refresh_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: evidence/source_health.json
          retention-days: 30
